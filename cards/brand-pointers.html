<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px">
  <div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/arrow.svg" width="24" height="24" alt="arrow"><span class="v" style="font-size:.56rem">arrow</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/point.svg" width="24" height="24" alt="point"><span class="v" style="font-size:.56rem">point</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/pressed.svg" width="24" height="24" alt="pressed"><span class="v" style="font-size:.56rem">pressed</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/text.svg" width="24" height="24" alt="text"><span class="v" style="font-size:.56rem">text</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/cross.svg" width="24" height="24" alt="cross"><span class="v" style="font-size:.56rem">cross</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/grab.svg" width="24" height="24" alt="grab"><span class="v" style="font-size:.56rem">grab</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/move.svg" width="24" height="24" alt="move"><span class="v" style="font-size:.56rem">move</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/zoom.svg" width="24" height="24" alt="zoom"><span class="v" style="font-size:.56rem">zoom</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/help.svg" width="24" height="24" alt="help"><span class="v" style="font-size:.56rem">help</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/working.svg" width="24" height="24" alt="working"><span class="v" style="font-size:.56rem">working</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/blocked.svg" width="24" height="24" alt="blocked"><span class="v" style="font-size:.56rem">blocked</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/resize-col.svg" width="24" height="24" alt="resize-col"><span class="v" style="font-size:.56rem">resize-col</span></div><div class="col" style="justify-items:center;gap:5px;padding:7px 0;background:var(--pp-sunk);background-image:linear-gradient(45deg,var(--pp-hair) 25%,transparent 25%,transparent 75%,var(--pp-hair) 75%);background-size:8px 8px"><img src="../assets/cursors/light/resize-row.svg" width="24" height="24" alt="resize-row"><span class="v" style="font-size:.56rem">resize-row</span></div>
</div>
<p style="margin:11px 0 0;font-size:.8rem;line-height:1.5;color:var(--pp-muted)">Hotspots are contract. <strong style="font-weight:600">point</strong> casts 1.1px in plate 3 so a clickable surface reads as raised; <strong style="font-weight:600">pressed</strong> casts 0.5px. The swap is instant, never animated.</p>
</body></html>
