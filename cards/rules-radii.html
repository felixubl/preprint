<!-- @dsCard group="Rules" viewport="700x150" name="The cut scale" subtitle="2 3 4 6 — trimmed, not moulded. Pill is tags only." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="row" style="align-items:flex-end;gap:14px">
  <div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:56px;height:56px;border:1px solid var(--pp-edge);background:var(--pp-surface);border-radius:2px"></span><span class="v">sm · 2px</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:56px;height:56px;border:1px solid var(--pp-edge);background:var(--pp-surface);border-radius:3px"></span><span class="v">md · 3px</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:56px;height:56px;border:1px solid var(--pp-edge);background:var(--pp-surface);border-radius:4px"></span><span class="v">lg · 4px</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:56px;height:56px;border:1px solid var(--pp-edge);background:var(--pp-surface);border-radius:6px"></span><span class="v">xl · 6px</span></div>
  <div class="col" style="justify-items:center;gap:5px;flex:1"><span style="display:block;width:100%;height:30px;border:1px dashed var(--pp-line);border-radius:9999px"></span><span class="v" style="color:var(--pp-plate-2-text)">pill — tags only, never a control</span></div>
</div>
</body></html>
