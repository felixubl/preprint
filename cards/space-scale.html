<!-- @dsCard group="Spacing" viewport="700x150" name="Space, 4px base" subtitle="Six steps, no in-betweens" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="row" style="align-items:flex-end;gap:6px">
  <div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:4px;height:26px;background:var(--pp-plate-3)"></span><span class="v">4</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:8px;height:38px;background:var(--pp-plate-3)"></span><span class="v">8</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:12px;height:50px;background:var(--pp-plate-3)"></span><span class="v">12</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:20px;height:62px;background:var(--pp-plate-3)"></span><span class="v">20</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:32px;height:74px;background:var(--pp-plate-3)"></span><span class="v">32</span></div><div class="col" style="justify-items:center;gap:5px"><span style="display:block;width:52px;height:86px;background:var(--pp-plate-3)"></span><span class="v">52</span></div>
  <span class="v" style="margin-left:12px">--pp-space-1 … --pp-space-6</span>
</div>
</body></html>
