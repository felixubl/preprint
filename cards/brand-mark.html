<!-- @dsCard group="Brand" viewport="700x170" name="The mark" subtitle="Three plates, misregistered — no logo, by design" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="row" style="align-items:center;gap:20px">
  <span style="position:relative;display:block;width:64px;height:64px;flex:none">
    <span style="position:absolute;left:0;top:0;width:42px;height:42px;background:var(--pp-plate-1);mix-blend-mode:multiply"></span>
    <span style="position:absolute;left:22px;top:5px;width:42px;height:42px;background:var(--pp-plate-2);mix-blend-mode:multiply"></span>
    <span style="position:absolute;left:10px;top:22px;width:42px;height:42px;background:var(--pp-plate-3);mix-blend-mode:multiply"></span>
  </span>
  <div class="col" style="gap:5px">
    <code style="font-family:var(--pp-font-mono);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700">Preprint</code>
    <p style="margin:0;font-size:.84rem;line-height:1.55;color:var(--pp-muted);max-width:52ch">Three offset squares, multiplied — the plates before they register. There is no drawn logo: the wordmark is Cousine, letterspaced, and the mark is the three inks themselves.</p>
  </div>
</div>
</body></html>
