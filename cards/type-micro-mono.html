<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="col" style="gap:7px">
  <p style="margin:0;font-size:.8125rem;line-height:1.5;color:var(--pp-muted);max-width:70ch">Captions, table cells and footnotes live at 13px. Never smaller — small text is where a face fails first, and where a system quietly stops being read.</p>
  <code style="font-family:var(--pp-font-mono);font-size:.8125rem;line-height:1.7;color:var(--pp-faint)">--pp-marker-citron: rgba(222,238,46,.62);</code>
  <span class="v">--pp-size-micro · --pp-size-mono · Cousine</span>
</div>
</body></html>
