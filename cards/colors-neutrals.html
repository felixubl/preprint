<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="row">
  <div class="col" style="flex:1"><div style="height:60px;background:var(--pp-paper);box-shadow:inset 0 0 0 1px var(--pp-hair)"></div><span class="k">paper</span></div><div class="col" style="flex:1"><div style="height:60px;background:var(--pp-surface);box-shadow:inset 0 0 0 1px var(--pp-hair)"></div><span class="k">surface</span></div><div class="col" style="flex:1"><div style="height:60px;background:var(--pp-sunk);box-shadow:inset 0 0 0 1px var(--pp-hair)"></div><span class="k">sunk</span></div><div class="col" style="flex:1"><div style="height:60px;background:var(--pp-code);box-shadow:inset 0 0 0 1px var(--pp-hair)"></div><span class="k">code</span></div><div class="col" style="flex:1"><div style="height:60px;background:var(--pp-ink);box-shadow:inset 0 0 0 1px var(--pp-hair)"></div><span class="k">ink</span></div><div class="col" style="flex:1"><div style="height:60px;background:var(--pp-muted);box-shadow:inset 0 0 0 1px var(--pp-hair)"></div><span class="k">muted</span></div><div class="col" style="flex:1"><div style="height:60px;background:var(--pp-faint);box-shadow:inset 0 0 0 1px var(--pp-hair)"></div><span class="k">faint</span></div>
</div>
</body></html>
