<!-- @dsCard group="Colors" viewport="700x150" name="Markers" subtitle="Fields behind type, never type itself" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="col" style="gap:8px">
  <span style="font-size:1rem"><span style="background:var(--pp-marker-citron);padding:.06em .12em">citron — the passage someone came back to</span></span>
  <span style="font-size:1rem"><span style="background:var(--pp-marker-pink);padding:.06em .12em">pink — a disagreement in the margin</span></span>
  <span style="font-size:1rem"><span style="background:var(--pp-marker-cyan);padding:.06em .12em">cyan — a definition worth keeping</span></span>
  <span class="v" style="margin-top:2px">citron as TEXT on paper is 1.6:1 · as a field behind ink, 14:1</span>
</div>
</body></html>
