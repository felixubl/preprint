<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="row">
  <div class="col" style="flex:1"><div style="height:74px;background:var(--pp-plate-1)"></div><span class="k">plate 1</span><span class="v">#01a368 / #22c98d</span></div>
  <div class="col" style="flex:1"><div style="height:74px;background:var(--pp-plate-2)"></div><span class="k">plate 2</span><span class="v">#ed0a3f / #ff4364</span></div>
  <div class="col" style="flex:1"><div style="height:74px;background:var(--pp-plate-3)"></div><span class="k">plate 3</span><span class="v">#0066ff / #5b93ff</span></div>
</div>
</body></html>
