<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="row" style="gap:12px">
  <div style="flex:1;border-top:6px solid var(--pp-plate-1);padding-top:8px">
    <span class="k" style="color:var(--pp-plate-1-text)">research</span>
    <p style="margin:6px 0 0;font-size:.92rem;line-height:1.55"><span style="float:left;font-family:var(--pp-font-display);font-weight:900;font-size:3.2em;line-height:.76;letter-spacing:-.04em;color:var(--pp-plate-1);padding-right:.07em;margin-top:.05em">M</span>arket design asks what a rule does to the people it binds.</p>
  </div><div style="flex:1;border-top:6px solid var(--pp-plate-3);padding-top:8px">
    <span class="k" style="color:var(--pp-plate-3-text)">notes</span>
    <p style="margin:6px 0 0;font-size:.92rem;line-height:1.55"><span style="float:left;font-family:var(--pp-font-display);font-weight:900;font-size:3.2em;line-height:.76;letter-spacing:-.04em;color:var(--pp-plate-3);padding-right:.07em;margin-top:.05em">I</span> spent a weekend learning how one neuron does linear regression.</p>
  </div><div style="flex:1;border-top:6px solid var(--pp-plate-2);padding-top:8px">
    <span class="k" style="color:var(--pp-plate-2-text)">argument</span>
    <p style="margin:6px 0 0;font-size:.92rem;line-height:1.55"><span style="float:left;font-family:var(--pp-font-display);font-weight:900;font-size:3.2em;line-height:.76;letter-spacing:-.04em;color:var(--pp-plate-2);padding-right:.07em;margin-top:.05em">T</span>here is no neutral way to allocate a scarce thing.</p>
  </div>
</div>
</body></html>
