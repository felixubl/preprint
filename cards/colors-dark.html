<!-- @dsCard group="Colors" viewport="700x170" name="Dark mode" subtitle="Designed graphite, not an inversion" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--pp-paper);font-family:var(--pp-font-body)}
.k{font-family:var(--pp-font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-faint)}
.v{font-family:var(--pp-font-mono);font-size:.62rem;color:var(--pp-muted)}
.row{display:flex;gap:10px}.col{display:grid;gap:4px}</style></head><body>
<div class="row" style="gap:12px">
  <div style="flex:1;padding:12px;background:#fbfbf9;box-shadow:inset 0 0 0 1px rgba(23,23,22,.11)">
    <span style="font-family:var(--pp-font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#6a6a62">light</span>
    <div style="display:flex;gap:6px;margin-top:8px"><span style="width:26px;height:26px;background:#01a368"></span><span style="width:26px;height:26px;background:#ed0a3f"></span><span style="width:26px;height:26px;background:#0066ff"></span><span style="width:26px;height:26px;background:#171716"></span></div>
    <p style="margin:8px 0 0;font-size:.8rem;color:#52524b">Ink #171716 on paper #fbfbf9.</p>
  </div>
  <div style="flex:1;padding:12px;background:#111214">
    <span style="font-family:var(--pp-font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#8f8f86">dark</span>
    <div style="display:flex;gap:6px;margin-top:8px"><span style="width:26px;height:26px;background:#22c98d"></span><span style="width:26px;height:26px;background:#ff4364"></span><span style="width:26px;height:26px;background:#5b93ff"></span><span style="width:26px;height:26px;background:#ecece6"></span></div>
    <p style="margin:8px 0 0;font-size:.8rem;color:#a4a49c">Plates brighten; markers drop opacity so the ink above never changes.</p>
  </div>
</div>
</body></html>
